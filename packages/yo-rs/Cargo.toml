# ───────────────────────────────────────────────────────────────────────
# PACKAFGE INFO
[package]
name    = "yo-rs"
version = "0.2.3"
edition = "2021"
# ───────────────────────────────────────────────────────────────────────
description = """
  yo-rs is a multi-client wake word detection and transcription server with a deterministic natural-language command engine and an offline voice interface. All communication is over TCP with a simple binary protocol. """
# ───────────────────────────────────────────────────────────────────────
authors    = ["QuackHack-McBlindy"]
repository = "https://github.com/QuackHack-McBlindy/yo"
license    = "MIT"
readme     = "README.md"
keywords   = ["wakeword", "speech-to-text", "interpreter", "multi-client"]

# ───────────────────────────────────────────────────────────────────────
# DEPENDENCIES
[dependencies]
clap        = { version = "4.0", features = ["derive"] }
tokio       = { version = "1", features   = ["full"] }
serde       = { version = "1.0", features = ["derive"] }
oww-rs      = { path = "vendor/oww-rs" }
whisper-rs  = "0.8"
serde_json  = "1.0"
cpal        = "0.16"
anyhow      = "1.0"
env_logger  = "0.11"
byteorder   = "1.5"
rodio       = "0.17"
nnnoiseless = "0.5.2"

tokio-tungstenite       = "0.20"
futures-util            = "0.3"

# ───────────────────────────────────────────────────────────────────────
# Logging dependencies
ducktrace-logger = "0.1.4"
log              = "0.4"
lazy_static      = "1.4"
dirs             = "5.0"
tempfile         = "3.8"
colored          = "2.1"
hound            = "3.5"

# ───────────────────────────────────────────────────────────────────────
# Shell translator dependencies
chrono = { version = "0.4", features = ["serde", "clock"] }
regex  = "1.0"
rand   = "0.8"
rayon = "1.10"

# ───────────────────────────────────────────────────────────────────────
# EXECUTABLES
# Server
[[bin]]
name = "yo-rs"
path = "src/main.rs"

# Microphone client
[[bin]]
name = "yo-client"
path = "src/yo-client.rs"

# Interpreter
[[bin]]
name = "yo-do"
path = "src/yo-do.rs"

# Text-to-speech
[[bin]]
name = "yo-say"
path = "src/yo-say.rs"


# Sentences testing
[[bin]]
name = "yo-tests"
path = "src/yo-tests.rs"
