# ───────────────────────────────────────────────────────────────────────
# PACKAFGE INFO
[package]
name    = "yo-rs"
version = "0.2.0"
edition = "2021"
# ───────────────────────────────────────────────────────────────────────
description = """
  yo-rs is a multi-client wake word detection and transcription server with shell command translation and execution. 
  Including microphone client. All communication is over TCP with a simple binary protocol. 
  yo-rs is a full-stack voice assistant."""
# ───────────────────────────────────────────────────────────────────────
authors    = ["QuackHack-McBlindy"]
repository = "https://github.com/QuackHack-McBlindy/yo"
license    = "MIT"
readme     = "README.md"
keywords   = ["wakeword", "speech-to-text", "shell-translator", "multi-client"]

# ───────────────────────────────────────────────────────────────────────
# DEPENDENCIES
[dependencies]
clap        = { version = "4.0", features = ["derive"] }
tokio       = { version = "1", features   = ["full"] }
serde       = { version = "1.0", features = ["derive"] }
oww-rs      = { path = "vendor/oww-rs" }
whisper-rs  = "0.8"
serde_json  = "1.0"
cpal        = "0.16"
anyhow      = "1.0"
env_logger  = "0.11"
byteorder   = "1.5"
rodio       = "0.17"
nnnoiseless = "0.5.2"

tokio-tungstenite       = "0.20"
futures-util            = "0.3"

# ───────────────────────────────────────────────────────────────────────
# Logging dependencies
ducktrace-logger = "0.1.4"
log              = "0.4"
lazy_static      = "1.4"
dirs             = "5.0"
tempfile         = "3.8"
colored          = "2.1"
hound            = "3.5"

# ───────────────────────────────────────────────────────────────────────
# Shell translator dependencies (yo-do)
chrono = { version = "0.4", features = ["serde", "clock"] }
regex  = "1.0"
rand   = "0.8"

# ───────────────────────────────────────────────────────────────────────
# Compiler
toml = "0.8"

# ───────────────────────────────────────────────────────────────────────
# EXECUTABLES
[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "yo-client"
path = "src/yo-client.rs"

[[bin]]
name = "yo-do"
path = "src/yo-do.rs"

[[bin]]
name = "yo-tests"
path = "src/yo-tests.rs"

[[bin]]
name = "yo-say"
path = "src/yo-say.rs"


