# .github/workflows/ci.yml
# this workflow requires at least one version tag with the current
# released version to exist before automatic releases can work.

name: CI

#  ├── CHANGELOG [Unreleased]
#  │        │
#  │        └── promote --> [0.3.1]
#  │
#  ├── create changelog commit locally
#  │
#  ├── create and push tag v0.3.1
#  │
#  ├── publish GitHub Release v0.3.1
#  │
#  ├── verify GitHub Release is published
#  │
#  ├── push changelog commit to main
#  │
#  ▼
# sync dev <-- MAIN


on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Nix build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - name: Check flake
        uses: DeterminateSystems/flake-checker-action@v12
        with:
          fail-mode: true

      - name: Build flake
        run: nix flake check

      - name: Generate options/service JSON
        run: bash hooks/get-options.sh

      - name: Build docs
        run: python3 hooks/build-docs.py

  release:
    name: Release
    needs: build
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.22.2


      - name: Check that this is a merge from dev
        id: merge
        run: |
          set -euo pipefail

          commit="${{ github.sha }}"
          subject=$(git log -1 --format=%s "$commit")

          if [[ ! "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\ .+/dev$ ]]; then
            echo "Not a dev -> main merge commit: $subject"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha=$(git rev-parse "${commit}^2")

          echo "Detected: $subject"
          echo "Dev head SHA: $head_sha"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"


      - name: Stop if not a dev -> main merge
        if: steps.merge.outputs.release != 'true'
        run: echo "No release required."


      - name: Determine and validate next version
        if: steps.merge.outputs.release == 'true'
        id: version
        run: |
          set -euo pipefail

          git fetch origin --tags

          latest_tag="$(
            git tag --list |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1
          )"

          if [[ -z "$latest_tag" ]]; then
            echo "error: no existing version tag found"
            echo "Create the initial version tag before using automatic releases."
            exit 1
          fi

          current_version="${latest_tag#v}"

          IFS='.' read -r major minor patch <<< "$current_version"
          expected_version="${major}.${minor}.$((patch + 1))"
          expected_tag="v${expected_version}"

          echo "Latest tag: $latest_tag"
          echo "Expected next version: $expected_version"

          system="x86_64-linux"

          mapfile -t packages < <(
            nix eval \
              --json \
              --impure \
              --no-write-lock-file \
              --apply builtins.attrNames \
              ".#packages.${system}" |
              jq -r '.[]'
          )

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "error: flake exposes no packages for ${system}"
            exit 1
          fi

          declare -A version_counts=()

          for package in "${packages[@]}"; do
            package_version="$(
              nix eval \
                --raw \
                --no-write-lock-file \
                ".#packages.${system}.${package}.version"
            )"

            if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: package '${package}' has invalid version '${package_version}'"
              exit 1
            fi

            echo "  ${package}: ${package_version}"

            version_counts["$package_version"]=$(
              printf '%s\n' "${version_counts[$package_version]:-0}" |
                awk '{print $1 + 1}'
            )
          done

          majority_version=""
          majority_count=0
          package_count="${#packages[@]}"

          for package_version in "${!version_counts[@]}"; do
            count="${version_counts[$package_version]}"

            if (( count > majority_count )); then
              majority_version="$package_version"
              majority_count="$count"
            elif (( count == majority_count )); then
              echo "error: package versions are tied"
              echo "  ${package_version}: ${count}"
              echo "  ${majority_version}: ${majority_count}"
              exit 1
            fi
          done

          if (( majority_count * 2 <= package_count )); then
            echo "error: no package version has a majority"
            exit 1
          fi

          echo "Majority package version: $majority_version"


          if [[ "$majority_version" == "$current_version" ]]; then

            if ! git show-ref --verify --quiet "refs/tags/$latest_tag"; then
              echo "error: package version matches latest tag, but tag is unavailable"
              exit 1
            fi

            release_sha=$(git rev-parse "${latest_tag}^{commit}")
            parent_sha=$(git rev-parse "${release_sha}^")

            if [[ "$parent_sha" != "$GITHUB_SHA" ]]; then
              echo "error: existing tag does not belong to this merge"
              echo "tag commit: $release_sha"
              echo "tag parent: $parent_sha"
              echo "merge SHA:  $GITHUB_SHA"
              exit 1
            fi


            echo "Existing tag: $latest_tag"
            echo "Release commit: $release_sha"
            echo "Merge commit: $GITHUB_SHA"

            expected_tag="$latest_tag"

          else


            if [[ "$majority_version" != "$expected_version" ]]; then
              echo "error: version mismatch"
              echo "  latest Git tag:        $latest_tag"
              echo "  expected next version: $expected_version"
              echo "  majority package:      $majority_version"
              exit 1
            fi

            echo "Normal release validation passed."

          fi

          echo "Release version: $expected_tag"
          echo "version=$expected_tag" >> "$GITHUB_OUTPUT"


      - name: Publish release safely
        if: steps.merge.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DEV_SHA: ${{ steps.merge.outputs.head_sha }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Preparing release $VERSION"

          if git ls-remote --exit-code --tags origin \
               "refs/tags/$VERSION" >/dev/null 2>&1; then

            echo "Existing tag found: $VERSION"
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"

            release_sha=$(git rev-parse "${VERSION}^{commit}")
            parent_sha=$(git rev-parse "${release_sha}^")

            if [[ "$parent_sha" != "$BASE_SHA" ]]; then
              echo "error: existing tag points to an unexpected commit"
              echo "tag:    $release_sha"
              echo "parent: $parent_sha"
              echo "base:   $BASE_SHA"
              exit 1
            fi

          else

            echo "Preparing new release commit"

            git show "${DEV_SHA}:CHANGELOG.md" > CHANGELOG.md

            if ! awk '/^## \[Unreleased\]/{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md |
                 grep -qE '^[[:space:]]*[-*+][[:space:]]'; then
              echo "error: [Unreleased] section is empty"
              exit 1
            fi

            python3 hooks/promote-changelog.py "${VERSION#v}"

            awk -v v="${VERSION#v}" '
              $0 ~ "^## \\[" v "\\]" {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > /tmp/notes.md

            test -s /tmp/notes.md || {
              echo "error: release notes are empty"
              exit 1
            }

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add CHANGELOG.md
            git commit -m "chore(release): $VERSION [skip ci]"

            release_sha=$(git rev-parse HEAD)

            git tag -a "$VERSION" -m "$VERSION"

            git push origin "$VERSION"
          fi


          git show "${release_sha}:CHANGELOG.md" > /tmp/release-changelog.md

          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' /tmp/release-changelog.md > /tmp/notes.md

          test -s /tmp/notes.md || {
            echo "error: tagged release has no changelog notes"
            exit 1
          }


          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $VERSION"
          else
            echo "Creating GitHub Release: $VERSION"

            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file /tmp/notes.md \
              --verify-tag \
              --latest
          fi


          release_status=$(
            gh release view "$VERSION" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv'
          )

          if [[ "$release_status" != $'false\tfalse' ]]; then
            echo "error: release is not published as a stable release"
            exit 1
          fi

          echo "GitHub Release published: $VERSION"


          git fetch origin main

          remote_main=$(git rev-parse origin/main)

          if git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release commit already exists on main."
          elif [[ "$remote_main" == "$BASE_SHA" ]]; then
            git push origin "$release_sha:refs/heads/main"
            echo "Promoted changelog pushed to main."
          else
            echo "error: main advanced unexpectedly."
            echo "Release is published, but changelog sync needs recovery."
            echo "Release commit: $release_sha"
            echo "Current main:   $remote_main"
            exit 1
          fi

          echo "Release $VERSION completed successfully."


      - name: Sync dev with main
        if: steps.merge.outputs.release == 'true'
        run: |
          set -euo pipefail
          git fetch origin dev main
          git checkout -B dev origin/dev

          if git merge --no-ff origin/main \
               -m "chore: sync dev with main after ${{ steps.version.outputs.version }} [skip ci]"; then
            git push origin dev
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "CHANGELOG.md" ]]; then
            echo "error: unexpected merge conflicts:"
            printf '  %s\n' "${conflicts[@]}"
            git merge --abort
            exit 1
          fi

          git checkout --theirs -- CHANGELOG.md
          git add CHANGELOG.md
          git commit --no-edit
          git push origin dev
